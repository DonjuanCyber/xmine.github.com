<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>XMINE | Premium Trading Platform</title>
<link rel="icon" href="favicon.ico">

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">

<style>
:root{
  --gold:#d4af37;
  --dark:#070d1a;
  --glass:rgba(255,255,255,0.05);
}

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:'Poppins',sans-serif;
}

body{
  background: radial-gradient(circle at top,#0b1220,#000);
  color:#fff;
}

/* HEADER */
header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:15px 5%;
  background:rgba(0,0,0,0.5);
  backdrop-filter:blur(10px);
}

.logo{
  display:flex;
  align-items:center;
  gap:10px;
}

.logo img{
  width:40px;
}

.logo h2{
  font-size:18px;
}

/* HERO (MOBILE FIRST) */
.hero{
  display:flex;
  align-items:flex-start;
  justify-content:center;
  text-align:center;
  padding:100px 20px 60px;
}

.hero-logo{
  width:140px;
  margin-bottom:20px;
  display:block;
  margin-left:auto;
  margin-right:auto;
  filter:drop-shadow(0 0 20px rgba(212,175,55,0.6));
}

.hero h1{
  font-size:2rem;
  line-height:1.3;
  margin-bottom:15px;
}

.hero span{
  color:var(--gold);
}

.hero p{
  font-size:14px;
  color:#aaa;
  margin-bottom:30px;
}

/* BUTTON */
.btn{
  padding:12px 28px;
  border-radius:30px;
  border:none;
  background:linear-gradient(135deg,var(--gold),#fff2b0);
  color:#000;
  font-weight:600;
}

/* SECTION */
.section{
  padding:70px 5%;
  text-align:center;
}

/* CARDS */
.cards{
  display:grid;
  gap:20px;
  margin-top:30px;
}

.card{
  background:var(--glass);
  padding:25px;
  border-radius:15px;
}

/* DESKTOP VERSION */
@media(min-width:768px){

  header{
    padding:20px 10%;
  }

  .logo img{
    width:50px;
  }

  .logo h2{
    font-size:22px;
  }

  .hero{
    min-height:100vh;
    align-items:center;
    padding:0 20px;
  }

  .hero-logo{
    width:200px;
    margin-bottom:30px;
  }

  .hero h1{
    font-size:3.2rem;
  }

  .hero p{
    font-size:16px;
    max-width:600px;
    margin:auto;
    margin-bottom:40px;
  }

  .cards{
    grid-template-columns:repeat(3,1fr);
    gap:30px;
  }

  .card{
    padding:35px;
  }
}
</style>
</head>

<body>

<header>
  <div class="logo">
    <img src="logo.png">
    <h2>XMINE</h2>
  </div>
</header>

<section class="hero">
  <div>

    <img src="logo.png" class="hero-logo">

    <h1>Next Generation <span>Trading Platform</span></h1>

    <p>Menghubungkan seller dan buyer secara langsung dengan sistem transparan, aman, dan berbasis teknologi modern.</p>

    <button class="btn">Mulai Sekarang</button>

  </div>
</section>

<section class="section">
  <h2>Layanan Kami</h2>

  <div class="cards">
    <div class="card">
      <h3>Direct Trading</h3>
      <p>Tanpa perantara.</p>
    </div>

    <div class="card">
      <h3>Secure System</h3>
      <p>Keamanan tinggi.</p>
    </div>

    <div class="card">
      <h3>Global Market</h3>
      <p>Pasar internasional.</p>
    </div>
  </div>
</section>

</body>
</html>
